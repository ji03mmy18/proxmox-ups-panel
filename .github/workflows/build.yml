name: Build deb package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot debhelper

      - name: Build deb
        run: make deb

      - name: Get version from changelog
        id: version
        run: |
          VERSION=$(dpkg-parsechangelog -l debian/changelog -S Version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "deb=pve-ups-panel_${VERSION}_all.deb" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pve-ups-panel-${{ steps.version.outputs.version }}
          path: "*.deb"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.deb }}
          generate_release_notes: true
